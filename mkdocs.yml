site_name: Informatika
site_url: ""
docs_dir: docs
theme:
  name: material
  language: cs
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.css
plugins:
  - search
markdown_extensions:
